name: Sync with Upstream

on:
  schedule:
    # 每周一、三、五早上 8 点 UTC（北京时间下午 4 点）
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/shy3130/tick-stock-panel.git
          git fetch upstream main
          git checkout main
          git merge upstream/main -m "Sync with upstream $(date -u +'%Y-%m-%d %H:%M')"
          git push origin main
        continue-on-error: true

      - name: Create issue if sync failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ 自动同步失败',
              body: '自动同步上游仓库失败，可能存在冲突。请手动同步：https://github.com/codersm/tick-stock-panel/sync',
              labels: ['sync']
            })
